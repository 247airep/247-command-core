<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24/7 Command Core</title><style>body{margin:0;background:#080a0e;color:#f5f2e9;font:15px system-ui}main{max-width:1050px;margin:auto;padding:35px 18px}h1{font-size:clamp(40px,7vw,70px);margin:10px 0}.gold{color:#d6a94b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{background:#11151b;border:1px solid #29303a;border-radius:16px;padding:17px;margin:10px 0}.muted{color:#9ca3ad}.money{font-size:26px;font-weight:800}</style></head><body><main><div class="gold">24/7 AI REP · COMMAND CORE</div><h1>What needs attention now?</h1><p class="muted">Complexity In → Decision Clarity Out</p><div id="q"></div><p class="muted">Illustrative demo data. Potential exposure is not realized savings.</p></main><script>fetch('/api/command').then(r=>r.json()).then(x=>q.innerHTML=x.map((s,i)=>`<div class="card"><b class="gold">0${i+1}</b> · <b>${s.title}</b><div class="money">$${s.exposure.toLocaleString()}</div><div class="muted">${s.company} · confidence ${Math.round(s.confidence*100)}% · ${s.evidence} evidence records</div><p>${s.next}</p><div class="muted">Unknown: ${s.unknown}</div></div>`).join('')).catch(()=>q.innerHTML='<div class="card">Backend not running.</div>')</script></body></html>
