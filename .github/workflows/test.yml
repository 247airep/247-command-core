name: test
on:
  pull_request:
  push:
    branches: [main, prelaunch-profit-watch-v1]
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
